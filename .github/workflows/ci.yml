name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ESLint ${{ matrix.eslint }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        eslint: [9]
        include:
          - node: 22
            eslint: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use ESLint ${{ matrix.eslint }}
        if: matrix.eslint != 9
        run: pnpm add -D eslint@^${{ matrix.eslint }}
      - run: pnpm test
      - name: Check published files
        run: npm pack --dry-run
