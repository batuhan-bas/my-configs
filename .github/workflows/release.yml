name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm Trusted Publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm >= 11.5.1 (pnpm publish hands off to the npm CLI)
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile

      # Opens a "chore: version packages" PR when changesets exist on main.
      # Merging that PR bumps the version, updates CHANGELOG.md and publishes to npm.
      # No npm token: authentication uses the Trusted Publisher configured on npmjs.com.
      # Versions that already exist on npm are skipped.
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
